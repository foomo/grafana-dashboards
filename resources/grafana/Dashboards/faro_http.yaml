apiVersion: dashboard.grafana.app/v2beta1
kind: Dashboard
metadata:
  name: grafana_faro_http
spec:
  annotations:
  - kind: AnnotationQuery
    spec:
      builtIn: true
      enable: true
      hide: true
      iconColor: rgba(0, 211, 255, 1)
      name: Annotations & Alerts
      query:
        group: grafana
        kind: DataQuery
        spec: {}
        version: v0
  cursorSync: "Off"
  editable: true
  elements:
    panel-10:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: loki
                  group: loki
                  kind: DataQuery
                  spec:
                    direction: backward
                    editorMode: code
                    expr: quantile_over_time($percentile, ({service_name="faro", app="$app", kind="event"} |= `"event_name":"faro.performance.resource"` |~ `"event_data_initiatorType":"(fetch|xmlhttprequest)"` | json  | k6_isK6Browser=~"" | line_format "{{.event_data_name}}" | pattern "<_>://<event_data_http_host>/<path>" | unwrap event_data_transferSize [$__auto]))
                    queryType: instant
                  version: v0
                refId: A
            queryOptions: {}
            transformations: []
        description: ""
        id: 10
        links: []
        title: Transfer Size
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  mode: thresholds
                noValue: "0"
                thresholds:
                  mode: absolute
                  steps:
                  - color: blue
                    value: 0
                unit: bytes
              overrides: []
            options:
              colorMode: value
              graphMode: none
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs:
                - mean
                fields: ""
                values: false
              showPercentChange: false
              textMode: auto
              wideLayout: true
          version: 12.2.0
