                  hidden: false
                  query:
                    group: loki
                    kind: DataQuery
                    spec:
                      direction: backward
                      editorMode: code
                      expr: >-
                        avg_over_time({service_name="faro", kind="measurement",
                        app="$app"} |= `"lcp":` | json | unwrap lcp [$__range])
