                      legendFormat: LCP
                      queryType: range
                    version: v0
                  refId: A
            queryOptions: {}
            transformations: []
        description: >-
          Largest Contentful Paint (LCP): measures loading performance. To
          provide a good user experience, LCP should occur within 2.5 seconds of
          when the page first starts loading.

          https://web.dev/lcp/
        id: 10
        links: []
        title: LCP
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  mode: thresholds
                thresholds:
                  mode: absolute
                  steps:
                    - color: green
                      value: 0
                    - color: '#EAB839'
