apiVersion: dashboard.grafana.app/v2beta1
kind: Dashboard
metadata:
  name: imgproxy_imgproxy
spec:
  annotations:
    - kind: AnnotationQuery
      spec:
        builtIn: true
        enable: true
        hide: true
        iconColor: rgba(0, 211, 255, 1)
        legacyOptions:
          limit: 100
          showIn: 0
        name: Annotations & Alerts
        query:
          group: grafana
          kind: DataQuery
          spec: {}
          version: v0
  cursorSync: Crosshair
  editable: true
  elements:
    panel-2:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  hidden: false
                  query:
                    group: prometheus
                    kind: DataQuery
                    spec:
                      editorMode: code
                      exemplar: true
                      expr: >-
                        histogram_quantile($percentile,
                        sum(rate(imgproxy_request_duration_seconds_bucket{app="$application"}[$__rate_interval]))
                        by (le)) > 0
                      instant: false
                      legendFormat: Request
                      range: true
                    version: v0
                  refId: D
              - kind: PanelQuery
                spec:
                  hidden: false
                  query:
                    group: prometheus
                    kind: DataQuery
                    spec:
                      editorMode: code
                      exemplar: true
                      expr: >-
                        histogram_quantile($percentile,
                        sum(rate(imgproxy_processing_duration_seconds_bucket{app="$application"}[$__rate_interval]))
                        by (le)) > 0
                      instant: false
                      legendFormat: Processing
                      range: true
                    version: v0
                  refId: A
              - kind: PanelQuery
                spec:
                  hidden: false
                  query:
                    group: prometheus
                    kind: DataQuery
                    spec:
                      editorMode: code
                      exemplar: true
                      expr: >-
                        histogram_quantile($percentile,
                        sum(rate(imgproxy_download_duration_seconds_bucket{app="$application"}[$__rate_interval]))
                        by (le)) > 0
                      instant: false
                      legendFormat: Download
                      range: true
                    version: v0
                  refId: B
            queryOptions: {}
            transformations: []
        description: ''
        id: 2
        links: []
        title: Duration
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  mode: palette-classic
                custom:
                  axisBorderShow: false
                  axisCenteredZero: false
                  axisColorMode: text
                  axisLabel: ''
                  axisPlacement: auto
                  barAlignment: 0
                  barWidthFactor: 0.6
                  drawStyle: line
                  fillOpacity: 10
                  gradientMode: none
                  hideFrom:
                    legend: false
                    tooltip: false
                    viz: false
                  insertNulls: false
                  lineInterpolation: linear
                  lineWidth: 1
                  pointSize: 5
                  scaleDistribution:
                    type: linear
                  showPoints: never
                  showValues: false
                  spanNulls: false
                  stacking:
                    group: A
                    mode: none
                  thresholdsStyle:
                    mode: 'off'
                decimals: 1
                thresholds:
                  mode: absolute
                  steps:
                    - color: green
                      value: 0
                    - color: orange
                      value: 3
                    - color: dark-red
                      value: 10
                unit: s
              overrides: []
            options:
              dataLinks: []
              legend:
                calcs:
                  - mean
                  - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                hideZeros: false
                mode: multi
                sort: none
          version: 12.2.1
    panel-27:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  hidden: false
                  query:
                    datasource:
                      name: ${datasource}
                    group: prometheus
                    kind: DataQuery
                    spec:
                      editorMode: code
                      expr: >-
                        sum(increase(process_network_receive_bytes_total{app="$application"}[$__interval]))
                      instant: false
                      legendFormat: Received
                      range: true
                    version: v0
                  refId: B
              - kind: PanelQuery
                spec:
                  hidden: false
                  query:
                    group: prometheus
                    kind: DataQuery
                    spec:
                      editorMode: code
                      expr: >-
                        sum(increase(process_network_transmit_bytes_total{app="$application"}[$__interval]))
                      instant: false
                      legendFormat: Transmit
                      range: true
                    version: v0
                  refId: C
            queryOptions:
              interval: 2m
            transformations: []
        description: ''
        id: 27
        links: []
        title: Data Transfer
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  mode: palette-classic
                custom:
                  axisBorderShow: false
                  axisCenteredZero: false
                  axisColorMode: text
                  axisLabel: ''
                  axisPlacement: auto
                  barAlignment: 0
                  barWidthFactor: 0.6
                  drawStyle: line
                  fillOpacity: 62
                  gradientMode: opacity
                  hideFrom:
                    legend: false
                    tooltip: false
                    viz: false
                  insertNulls: false
                  lineInterpolation: linear
                  lineWidth: 2
                  pointSize: 5
                  scaleDistribution:
                    type: linear
                  showPoints: auto
                  showValues: false
                  spanNulls: true
                  stacking:
                    group: A
                    mode: normal
                  thresholdsStyle:
                    mode: dashed
                thresholds:
                  mode: absolute
                  steps:
                    - color: green
                      value: 0
                unit: bytes
              overrides: []
            options:
              legend:
                calcs:
                  - mean
                  - max
                displayMode: table
                placement: bottom
                showLegend: true
                sortBy: Max
                sortDesc: true
                width: 450
              tooltip:
                hideZeros: false
                mode: single
                sort: none
          version: 12.2.1
    panel-4:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  hidden: false
                  query:
                    group: prometheus
                    kind: DataQuery
                    spec:
                      editorMode: code
                      expr: >-
                        (sum(rate(imgproxy_errors_total{app="$application"}[$__rate_interval]))

                        /

                        sum(rate(imgproxy_requests_total{app="$application"}[$__rate_interval])))
                      format: time_series
                      interval: 1m
                      intervalFactor: 1
                      legendFormat: '{{type}}'
                      range: true
                    version: v0
                  refId: B
            queryOptions: {}
            transformations: []
        description: ''
        id: 4
        links: []
        title: Errors
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  mode: palette-classic
                custom:
                  axisBorderShow: false
                  axisCenteredZero: false
                  axisColorMode: text
                  axisLabel: Percentage
                  axisPlacement: auto
                  barAlignment: 0
                  barWidthFactor: 0.6
                  drawStyle: bars
                  fillOpacity: 100
                  gradientMode: none
                  hideFrom:
                    legend: false
                    tooltip: false
                    viz: false
                  insertNulls: false
                  lineInterpolation: linear
                  lineWidth: 1
                  pointSize: 5
                  scaleDistribution:
                    type: linear
                  showPoints: never
                  showValues: false
                  spanNulls: false
                  stacking:
                    group: A
                    mode: normal
                  thresholdsStyle:
                    mode: 'off'
                decimals: 1
                max: 1
                min: 0
                thresholds:
                  mode: absolute
                  steps:
                    - color: green
                      value: 0
                    - color: red
                      value: 0.25
                unit: percentunit
              overrides:
                - matcher:
                    id: byValue
                    options:
                      op: gte
                      reducer: allIsNull
                      value: 0
                  properties:
                    - id: custom.hideFrom
                      value:
                        legend: true
                        tooltip: true
                        viz: false
            options:
              dataLinks: []
              legend:
                calcs:
                  - mean
                  - lastNotNull
                  - sum
                displayMode: table
                placement: bottom
                showLegend: false
              tooltip:
                hideZeros: false
                mode: multi
                sort: none
          version: 12.2.1
    panel-6:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  hidden: false
                  query:
                    group: prometheus
                    kind: DataQuery
                    spec:
                      editorMode: code
                      expr: >-
                        sum(rate(imgproxy_request_duration_seconds_count{app="$application"}[$__rate_interval]))
                      format: time_series
                      interval: 1m
                      intervalFactor: 1
                      legendFormat: Total
                      range: true
                    version: v0
                  refId: A
            queryOptions: {}
            transformations: []
        description: ''
        id: 6
        links: []
        title: Rate
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  mode: palette-classic
                custom:
                  axisBorderShow: false
                  axisCenteredZero: false
                  axisColorMode: text
                  axisLabel: Requests per Second
                  axisPlacement: auto
                  barAlignment: 0
                  barWidthFactor: 0.6
                  drawStyle: line
                  fillOpacity: 10
                  gradientMode: none
                  hideFrom:
                    legend: false
                    tooltip: false
                    viz: false
                  insertNulls: false
                  lineInterpolation: linear
                  lineWidth: 1
                  pointSize: 5
                  scaleDistribution:
                    type: linear
                  showPoints: never
                  showValues: false
                  spanNulls: false
                  stacking:
                    group: A
                    mode: none
                  thresholdsStyle:
                    mode: 'off'
                decimals: 2
                thresholds:
                  mode: absolute
                  steps:
                    - color: green
                      value: 0
                    - color: red
                      value: 80
                unit: short
              overrides: []
            options:
              dataLinks: []
              legend:
                calcs:
                  - mean
                  - lastNotNull
                displayMode: table
                placement: bottom
                showLegend: false
              tooltip:
                hideZeros: false
                mode: multi
                sort: none
          version: 12.2.1
  layout:
    kind: GridLayout
    spec:
      items: []
  links: []
  liveNow: false
  preload: false
  tags: []
  timeSettings:
    autoRefresh: ''
    autoRefreshIntervals:
      - 5s
      - 10s
      - 30s
      - 1m
      - 5m
      - 15m
      - 30m
      - 1h
      - 2h
      - 1d
    fiscalYearStartMonth: 0
    from: now-1h
    hideTimepicker: false
    timezone: ''
    to: now
  title: imgproxy
  variables:
    - kind: QueryVariable
      spec:
        allowCustomValue: true
        current:
          text: ''
          value: ''
        definition: label_values(app)
        hide: dontHide
        includeAll: false
        multi: false
        name: application
        options: []
        query:
          group: prometheus
          kind: DataQuery
          spec:
            qryType: 1
            query: label_values(app)
            refId: PrometheusVariableQueryEditor-VariableQuery
          version: v0
        refresh: onDashboardLoad
        regex: /^imgproxy.*/
        skipUrlSync: false
        sort: alphabeticalAsc
    - kind: CustomVariable
      spec:
        allowCustomValue: false
        current:
          text: '0.99'
          value: '0.99'
        hide: dontHide
        includeAll: false
        label: ‰
        multi: false
        name: percentile
        options:
          - selected: true
            text: '0.99'
            value: '0.99'
          - selected: false
            text: '0.95'
            value: '0.95'
          - selected: false
            text: '0.75'
            value: '0.75'
          - selected: false
            text: '0.5'
            value: '0.5'
        query: 0.99,0.95,0.75,0.5
        skipUrlSync: false
    - datasource:
        name: prometheus
      group: prometheus
      kind: AdhocVariable
      spec:
        allowCustomValue: false
        baseFilters: []
        defaultKeys:
          - text: namespace
            value: namespace
          - text: service
            value: service
          - text: pod
            value: pod
        filters:
          - condition: ''
            key: namespace
            keyLabel: namespace
            operator: '='
            value: shared-imgproxy
            valueLabels:
              - shared-imgproxy
          - condition: ''
            key: service
            keyLabel: service
            operator: '='
            value: imgproxy-imgproxy
            valueLabels:
              - imgproxy-imgproxy
        hide: hideLabel
        name: filter
        skipUrlSync: false
    - kind: DatasourceVariable
      spec:
        allowCustomValue: true
        current:
          text: ''
          value: ''
        hide: hideVariable
        includeAll: false
        multi: false
        name: datasource
        options: []
        pluginId: prometheus
        refresh: onDashboardLoad
        regex: ''
        skipUrlSync: false
status: {}
