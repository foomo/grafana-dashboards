apiVersion: dashboard.grafana.app/v2beta1
kind: Dashboard
metadata:
  annotations:
    grafana.app/folder: ""
  labels: null
  name: opentelemetry_http_client
  namespace: ""
spec:
  annotations:
  - kind: AnnotationQuery
    spec:
      builtIn: true
      enable: true
      hide: true
      iconColor: rgba(0, 211, 255, 1)
      name: Annotations & Alerts
      query:
        group: grafana
        kind: DataQuery
        spec:
          limit: 100
          matchAny: false
          tags: []
          type: dashboard
        version: v0
  cursorSync: Crosshair
  description: OpenTelemetry HTTP Client Metrics
  editable: true
  elements:
    panel-2:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  group: prometheus
                  kind: DataQuery
                  spec:
                    editorMode: code
                    expr: sum(rate(http_client_request_duration_seconds_count{namespace=~"$namespace", service=~"$service", server_address=~"$server"}[$interval])) by (server_address) > 0
                    legendFormat: "{{server_address}}"
                    range: true
                  version: v0
                refId: A
            queryOptions: {}
            transformations: []
        description: ""
        id: 2
        links: []
        title: Load
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  mode: palette-classic
                custom:
                  axisBorderShow: false
                  axisCenteredZero: false
                  axisColorMode: text
                  axisLabel: ""
                  axisPlacement: auto
                  barAlignment: 0
                  barWidthFactor: 0.6
                  drawStyle: line
                  fillOpacity: 62
                  gradientMode: opacity
                  hideFrom:
                    legend: false
                    tooltip: false
                    viz: false
                  insertNulls: false
                  lineInterpolation: linear
                  lineWidth: 2
                  pointSize: 5
                  scaleDistribution:
                    type: linear
                  showPoints: auto
                  showValues: false
                  spanNulls: true
                  stacking:
                    group: A
                    mode: none
                  thresholdsStyle:
                    mode: "off"
                thresholds:
                  mode: absolute
                  steps:
                  - color: green
                    value: 0
                  - color: red
                    value: 80
                unit: reqps
              overrides: []
            options:
              legend:
                calcs:
                - mean
                - max
                displayMode: table
                placement: bottom
                showLegend: true
                sortBy: Mean
                sortDesc: true
                width: 450
              tooltip:
                hideZeros: false
                mode: single
                sort: none
          version: 12.2.1
    panel-4:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${datasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    editorMode: code
                    exemplar: true
                    expr: histogram_quantile($percentile, sum(rate(http_client_request_duration_seconds_bucket{namespace=~"$namespace", service=~"$service", server_address=~"$server"}[$interval])) by (server_address, le)) > 0
                    legendFormat: "{{server_address}}"
                    range: true
                  version: v0
                refId: A
            queryOptions: {}
            transformations: []
        description: ""
        id: 4
        links: []
        title: Duration
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  mode: palette-classic
                custom:
                  axisBorderShow: false
                  axisCenteredZero: false
                  axisColorMode: text
                  axisLabel: ""
                  axisPlacement: auto
                  barAlignment: 0
                  barWidthFactor: 0.6
                  drawStyle: line
                  fillOpacity: 62
                  gradientMode: opacity
                  hideFrom:
                    legend: false
                    tooltip: false
                    viz: false
                  insertNulls: false
                  lineInterpolation: linear
                  lineWidth: 2
                  pointSize: 5
                  scaleDistribution:
                    type: linear
                  showPoints: auto
                  showValues: false
                  spanNulls: true
                  stacking:
                    group: A
                    mode: none
                  thresholdsStyle:
                    mode: dashed
                thresholds:
                  mode: absolute
                  steps:
                  - color: green
                    value: 0
                unit: s
              overrides: []
            options:
              legend:
                calcs:
                - mean
                - max
                displayMode: table
                placement: bottom
                showLegend: true
                sortBy: Max
                sortDesc: true
                width: 450
              tooltip:
                hideZeros: false
                mode: single
                sort: none
          version: 12.2.1
    panel-5:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  group: prometheus
                  kind: DataQuery
                  spec:
                    editorMode: code
                    expr: |-
                      (
                      sum(rate(http_client_request_duration_seconds_count{namespace=~"$namespace", service=~"$service", server_address=~"$server",http_status_code=~"(4|5).*"}[$interval])) by (server_address)
                      /
                      sum(rate(http_client_request_duration_seconds_count{namespace=~"$namespace", service=~"$service", server_address=~"$server"}[$interval])) by (server_address)
                      ) > 0
                    legendFormat: "{{namespace}}.{{service}}:{{server_name}} [5xx]"
                    range: true
                  version: v0
                refId: A
            queryOptions: {}
            transformations: []
        description: ""
        id: 5
        links: []
        title: Errors
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  fixedColor: dark-red
                  mode: fixed
                custom:
                  axisBorderShow: false
                  axisCenteredZero: false
                  axisColorMode: text
                  axisLabel: ""
                  axisPlacement: auto
                  barAlignment: 0
                  barWidthFactor: 0.6
                  drawStyle: line
                  fillOpacity: 62
                  gradientMode: opacity
                  hideFrom:
                    legend: false
                    tooltip: false
                    viz: false
                  insertNulls: false
                  lineInterpolation: linear
                  lineWidth: 2
                  pointSize: 5
                  scaleDistribution:
                    type: linear
                  showPoints: auto
                  showValues: false
                  spanNulls: true
                  stacking:
                    group: A
                    mode: none
                  thresholdsStyle:
                    mode: "off"
                thresholds:
                  mode: absolute
                  steps:
                  - color: green
                    value: 0
                  - color: red
                    value: 80
                unit: percentunit
              overrides: []
            options:
              legend:
                calcs:
                - mean
                - max
                displayMode: table
                placement: bottom
                showLegend: true
                sortBy: Max
                sortDesc: true
                width: 450
              tooltip:
                hideZeros: false
                mode: single
                sort: none
          version: 12.2.1
    panel-6:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${datasource}
                  group: prometheus
                  kind: DataQuery
                  spec:
                    editorMode: code
                    exemplar: false
                    expr: histogram_quantile($percentile, sum(rate(http_client_request_body_size_bytes_bucket{namespace=~"$namespace", service=~"$service", server_address=~"$server"}[$interval])) by (service, server_address, le))
                    legendFormat: "{{server_address}}"
                    range: true
                  version: v0
                refId: request
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  group: prometheus
                  kind: DataQuery
                  spec:
                    editorMode: code
                    expr: -histogram_quantile($percentile, sum(rate(http_client_response_body_size_bytes_bucket{namespace=~"$namespace", service=~"$service", server_address=~"$server"}[$interval])) by (service, server_address, le))
                    instant: false
                    legendFormat: "{{server_address}}"
                    range: true
                  version: v0
                refId: response
            queryOptions: {}
            transformations: []
        description: ""
        id: 6
        links: []
        title: Network
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  mode: palette-classic
                custom:
                  axisBorderShow: false
                  axisCenteredZero: false
                  axisColorMode: text
                  axisLabel: +In / +Out
                  axisPlacement: auto
                  barAlignment: 0
                  barWidthFactor: 0.6
                  drawStyle: line
                  fillOpacity: 62
                  gradientMode: opacity
                  hideFrom:
                    legend: false
                    tooltip: false
                    viz: false
                  insertNulls: false
                  lineInterpolation: linear
                  lineWidth: 2
                  pointSize: 5
                  scaleDistribution:
                    type: linear
                  showPoints: auto
                  showValues: false
                  spanNulls: true
                  stacking:
                    group: A
                    mode: none
                  thresholdsStyle:
                    mode: dashed
                thresholds:
                  mode: absolute
                  steps:
                  - color: green
                    value: 0
                unit: bytes
              overrides: []
            options:
              legend:
                calcs:
                - mean
                - max
                displayMode: table
                placement: bottom
                showLegend: true
                sortBy: Mean
                sortDesc: true
                width: 450
              tooltip:
                hideZeros: false
                mode: single
                sort: none
          version: 12.2.1
  layout:
    kind: GridLayout
    spec:
      items:
      - kind: GridLayoutItem
        spec:
          element:
            kind: ElementReference
            name: panel-2
          height: 10
          width: 8
          x: 0
          "y": 0
      - kind: GridLayoutItem
        spec:
          element:
            kind: ElementReference
            name: panel-5
          height: 10
          width: 8
          x: 8
          "y": 0
      - kind: GridLayoutItem
        spec:
          element:
            kind: ElementReference
            name: panel-4
          height: 10
          width: 8
          x: 16
          "y": 0
      - kind: GridLayoutItem
        spec:
          element:
            kind: ElementReference
            name: panel-6
          height: 7
          width: 24
          x: 0
          "y": 10
  links: []
  liveNow: false
  preload: false
  tags:
  - opentelementry
  - http
  - client
  timeSettings:
    autoRefresh: ""
    autoRefreshIntervals:
    - 5s
    - 10s
    - 30s
    - 1m
    - 5m
    - 15m
    - 30m
    - 1h
    - 2h
    - 1d
    fiscalYearStartMonth: 0
    from: now-30m
    hideTimepicker: false
    timezone: browser
    to: now
  title: OpenTelemetry / HTTP Client
  variables:
  - kind: IntervalVariable
    spec:
      auto: true
      auto_count: 30
      auto_min: 10s
      current:
        text: 1m
        value: 1m
      hide: dontHide
      label: ⏱︎
      name: interval
      options:
      - selected: true
        text: 1m
        value: 1m
      - selected: false
        text: 3m
        value: 3m
      - selected: false
        text: 5m
        value: 5m
      - selected: false
        text: 10m
        value: 10m
      - selected: false
        text: 30m
        value: 30m
      - selected: false
        text: 1h
        value: 1h
      query: 1m,3m,5m,10m,30m,1h
      refresh: onTimeRangeChanged
      skipUrlSync: false
  - kind: CustomVariable
    spec:
      allowCustomValue: true
      current:
        text: "99"
        value: "0.99"
      hide: dontHide
      includeAll: false
      label: P
      multi: false
      name: percentile
      options:
      - selected: true
        text: "99"
        value: "0.99"
      - selected: false
        text: "95"
        value: "0.95"
      - selected: false
        text: "90"
        value: "0.9"
      - selected: false
        text: "75"
        value: "0.75"
      - selected: false
        text: "50"
        value: "0.5"
      query: "99 : 0.99, 95 : 0.95, 90 : 0.9, 75 : 0.75, 50 : 0.5"
      skipUrlSync: false
  - kind: DatasourceVariable
    spec:
      allowCustomValue: true
      current:
        text: ""
        value: ""
      hide: hideVariable
      includeAll: false
      multi: false
      name: datasource
      options: []
      pluginId: prometheus
      refresh: onDashboardLoad
      regex: ""
      skipUrlSync: false
  - kind: QueryVariable
    spec:
      allowCustomValue: true
      current:
        text: ""
        value: ""
      definition: label_values(http_client_request_duration_seconds_count,namespace)
      hide: dontHide
      includeAll: true
      label: ⛴︎
      multi: true
      name: namespace
      options: []
      query:
        group: prometheus
        kind: DataQuery
        spec:
          qryType: 1
          query: label_values(http_client_request_duration_seconds_count,namespace)
          refId: PrometheusVariableQueryEditor-VariableQuery
        version: v0
      refresh: onTimeRangeChanged
      regex: ""
      skipUrlSync: false
      sort: alphabeticalAsc
  - kind: QueryVariable
    spec:
      allowCustomValue: true
      current:
        text: ""
        value: ""
      definition: label_values(http_client_request_duration_seconds_count{namespace=~"$namespace"},service)
      hide: dontHide
      includeAll: true
      label: ⛵︎
      multi: true
      name: service
      options: []
      query:
        datasource:
          name: ${datasource}
        group: prometheus
        kind: DataQuery
        spec:
          qryType: 1
          query: label_values(http_client_request_duration_seconds_count{namespace=~"$namespace"},service)
          refId: PrometheusVariableQueryEditor-VariableQuery
        version: v0
      refresh: onTimeRangeChanged
      regex: ""
      skipUrlSync: false
      sort: alphabeticalAsc
  - kind: QueryVariable
    spec:
      allowCustomValue: true
      current:
        text: ""
        value: ""
      definition: label_values(http_client_request_duration_seconds_count{namespace=~"$namespace", service=~"$service"},server_address)
      hide: dontHide
      includeAll: true
      multi: true
      name: server
      options: []
      query:
        group: prometheus
        kind: DataQuery
        spec:
          qryType: 1
          query: label_values(http_client_request_duration_seconds_count{namespace=~"$namespace", service=~"$service"},server_address)
          refId: PrometheusVariableQueryEditor-VariableQuery
        version: v0
      refresh: onTimeRangeChanged
      regex: ""
      skipUrlSync: false
      sort: alphabeticalAsc
