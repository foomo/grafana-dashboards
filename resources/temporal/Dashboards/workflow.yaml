apiVersion: dashboard.grafana.app/v2beta1
kind: Dashboard
metadata:
  name: temporal_workflow
spec:
  annotations:
    - kind: AnnotationQuery
      spec:
        builtIn: true
        enable: true
        hide: true
        iconColor: rgba(0, 211, 255, 1)
        name: Annotations & Alerts
        query:
          group: grafana
          kind: DataQuery
          spec: {}
          version: v0
  cursorSync: 'Off'
  editable: true
  elements:
    panel-1:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  hidden: false
                  query:
                    group: prometheus
                    kind: DataQuery
                    spec:
                      editorMode: code
                      exemplar: false
                      expr: >-
                        sum(increase(temporal_activity_task_error_total{workflow_type=~"$workflow",
                        activity_type=~"$activity"}[$__interval])) by
                        (workflow_type, activity_type)
                      instant: false
                      interval: ''
                      legendFormat: '{{workflow_type}}.{{activity_type}}'
                      range: true
                    version: v0
                  refId: A
            queryOptions: {}
            transformations: []
        description: ''
        id: 1
        links: []
        title: Workflow Activity Execution Errors
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  fixedColor: dark-red
                  mode: fixed
                custom:
                  axisBorderShow: false
                  axisCenteredZero: false
                  axisColorMode: text
                  axisLabel: ''
                  axisPlacement: auto
                  barAlignment: 0
                  barWidthFactor: 0.6
                  drawStyle: line
                  fillOpacity: 25
                  gradientMode: opacity
                  hideFrom:
                    legend: false
                    tooltip: false
                    viz: false
                  insertNulls: false
                  lineInterpolation: smooth
                  lineWidth: 2
                  pointSize: 5
                  scaleDistribution:
                    type: linear
                  showPoints: auto
                  showValues: false
                  spanNulls: false
                  stacking:
                    group: A
                    mode: none
                  thresholdsStyle:
                    mode: 'off'
                decimals: 0
                thresholds:
                  mode: absolute
                  steps:
                    - color: green
                      value: 0
                    - color: red
                      value: 80
                unit: none
              overrides: []
            options:
              legend:
                calcs:
                  - max
                displayMode: table
                placement: right
                showLegend: true
                sortBy: Name
                sortDesc: false
              tooltip:
                hideZeros: false
                mode: single
                sort: none
          version: 12.2.1
    panel-3:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  hidden: false
                  query:
                    group: prometheus
                    kind: DataQuery
                    spec:
                      editorMode: code
                      expr: >-
                        sum(increase(temporal_workflow_completed_total{workflow_type=~"$workflow"}[5m]))
                        by (workflow_type)
                      instant: false
                      interval: ''
                      legendFormat: '{{workflow_type}} Completed'
                      range: true
                    version: v0
                  refId: A
              - kind: PanelQuery
                spec:
                  hidden: false
                  query:
                    group: prometheus
                    kind: DataQuery
                    spec:
                      editorMode: code
                      expr: >-
                        sum(increase(temporal_workflow_canceled_total{workflow_type=~"$workflow"}[5m]))
                        by (workflow_type)
                      instant: false
                      legendFormat: '{{workflow_type}} Canceled'
                      range: true
                    version: v0
                  refId: B
              - kind: PanelQuery
                spec:
                  hidden: false
                  query:
                    group: prometheus
                    kind: DataQuery
                    spec:
                      editorMode: code
                      expr: >-
                        sum(increase(temporal_workflow_failed_total{workflow_type=~"$workflow"}[5m]))
                        by (workflow_type)
                      instant: false
                      legendFormat: '{{workflow_type}} Failed'
                      range: true
                    version: v0
                  refId: C
              - kind: PanelQuery
                spec:
                  hidden: false
                  query:
                    group: prometheus
                    kind: DataQuery
                    spec:
                      editorMode: code
                      expr: >-
                        sum(increase(temporal_workflow_terminated_total{workflow_type=~"$workflow"}[$__interval]))
                        by (workflow_type)
                      instant: false
                      interval: ''
                      legendFormat: '{{workflow_type}} Terminated'
                      range: true
                    version: v0
                  refId: D
            queryOptions:
              interval: 15s
            transformations: []
        description: ''
        id: 3
        links: []
        title: Workflows Executions
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  mode: palette-classic
                custom:
                  axisBorderShow: false
                  axisCenteredZero: false
                  axisColorMode: text
                  axisLabel: ''
                  axisPlacement: auto
                  barAlignment: 0
                  barWidthFactor: 0.6
                  drawStyle: line
                  fillOpacity: 25
                  gradientMode: opacity
                  hideFrom:
                    legend: false
                    tooltip: false
                    viz: false
                  insertNulls: false
                  lineInterpolation: smooth
                  lineWidth: 2
                  pointSize: 5
                  scaleDistribution:
                    type: linear
                  showPoints: auto
                  showValues: false
                  spanNulls: false
                  stacking:
                    group: A
                    mode: none
                  thresholdsStyle:
                    mode: 'off'
                decimals: 1
                thresholds:
                  mode: absolute
                  steps:
                    - color: green
                      value: 0
                    - color: red
                      value: 80
                unit: none
              overrides: []
            options:
              legend:
                calcs:
                  - mean
                  - max
                displayMode: table
                placement: right
                showLegend: true
                sortBy: Max
                sortDesc: true
              tooltip:
                hideZeros: false
                mode: single
                sort: none
          version: 12.2.1
    panel-4:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  hidden: false
                  query:
                    group: prometheus
                    kind: DataQuery
                    spec:
                      editorMode: code
                      expr: >-
                        sum(increase(temporal_activity_execution_latency_count{workflow_type=~"$workflow",
                        activity_type=~"$activity"}[5m])) by (workflow_type,
                        activity_type)
                      instant: false
                      legendFormat: '{{workflow_type}}.{{activity_type}}'
                      range: true
                    version: v0
                  refId: A
            queryOptions: {}
            transformations: []
        description: ''
        id: 4
        links: []
        title: Workflow Activities Executions
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  mode: palette-classic
                custom:
                  axisBorderShow: false
                  axisCenteredZero: false
                  axisColorMode: text
                  axisLabel: ''
                  axisPlacement: auto
                  barAlignment: 0
                  barWidthFactor: 0.6
                  drawStyle: line
                  fillOpacity: 25
                  gradientMode: opacity
                  hideFrom:
                    legend: false
                    tooltip: false
                    viz: false
                  insertNulls: false
                  lineInterpolation: smooth
                  lineWidth: 2
                  pointSize: 5
                  scaleDistribution:
                    type: linear
                  showPoints: auto
                  showValues: false
                  spanNulls: false
                  stacking:
                    group: A
                    mode: none
                  thresholdsStyle:
                    mode: 'off'
                decimals: 1
                thresholds:
                  mode: absolute
                  steps:
                    - color: green
                      value: 0
                    - color: red
                      value: 80
                unit: none
              overrides: []
            options:
              legend:
                calcs:
                  - mean
                  - max
                displayMode: table
                placement: right
                showLegend: true
                sortBy: Max
                sortDesc: true
              tooltip:
                hideZeros: false
                mode: single
                sort: none
          version: 12.2.1
    panel-5:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  hidden: false
                  query:
                    group: prometheus
                    kind: DataQuery
                    spec:
                      editorMode: code
                      expr: >-
                        histogram_quantile(0.95,
                        sum(rate(temporal_activity_execution_latency_bucket{workflow_type=~"$workflow",
                        activity_type=~"$activity"}[$__rate_interval])) by
                        (workflow_type, activity_type, le))
                      instant: false
                      legendFormat: '{{workflow_type}}.{{activity_type}}'
                      range: true
                    version: v0
                  refId: A
            queryOptions: {}
            transformations: []
        description: ''
        id: 5
        links: []
        title: Workflow Activity Execution Latency
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  mode: palette-classic
                custom:
                  axisBorderShow: false
                  axisCenteredZero: false
                  axisColorMode: text
                  axisLabel: ''
                  axisPlacement: auto
                  barAlignment: 0
                  barWidthFactor: 0.6
                  drawStyle: points
                  fillOpacity: 25
                  gradientMode: opacity
                  hideFrom:
                    legend: false
                    tooltip: false
                    viz: false
                  insertNulls: false
                  lineInterpolation: linear
                  lineStyle:
                    fill: solid
                  lineWidth: 2
                  pointSize: 5
                  scaleDistribution:
                    type: linear
                  showPoints: auto
                  showValues: false
                  spanNulls: false
                  stacking:
                    group: A
                    mode: none
                  thresholdsStyle:
                    mode: 'off'
                decimals: 0
                thresholds:
                  mode: absolute
                  steps:
                    - color: green
                      value: 0
                    - color: red
                      value: 80
                unit: s
              overrides: []
            options:
              legend:
                calcs:
                  - mean
                  - max
                displayMode: table
                placement: right
                showLegend: true
                sortBy: Max
                sortDesc: true
              tooltip:
                hideZeros: false
                mode: single
                sort: none
          version: 12.2.1
  layout:
    kind: GridLayout
    spec:
      items:
        - kind: GridLayoutItem
          spec:
            element:
              kind: ElementReference
              name: panel-3
            height: 8
            width: 24
            x: 0
            'y': 0
        - kind: GridLayoutItem
          spec:
            element:
              kind: ElementReference
              name: panel-4
            height: 8
            width: 24
            x: 0
            'y': 8
        - kind: GridLayoutItem
          spec:
            element:
              kind: ElementReference
              name: panel-1
            height: 9
            width: 24
            x: 0
            'y': 16
        - kind: GridLayoutItem
          spec:
            element:
              kind: ElementReference
              name: panel-5
            height: 8
            width: 24
            x: 0
            'y': 25
  links: []
  liveNow: false
  preload: false
  tags: []
  timeSettings:
    autoRefresh: ''
    autoRefreshIntervals:
      - 5s
      - 10s
      - 30s
      - 1m
      - 5m
      - 15m
      - 30m
      - 1h
      - 2h
      - 1d
    fiscalYearStartMonth: 0
    from: now-1h
    hideTimepicker: false
    timezone: browser
    to: now
  title: Workflow
  variables:
    - kind: QueryVariable
      spec:
        allowCustomValue: false
        current:
          text: ''
          value: ''
        definition: label_values(temporal_workflow_completed_total,workflow_type)
        hide: dontHide
        includeAll: true
        multi: true
        name: workflow
        options: []
        query:
          group: prometheus
          kind: DataQuery
          spec:
            qryType: 1
            query: label_values(temporal_workflow_completed_total,workflow_type)
            refId: PrometheusVariableQueryEditor-VariableQuery
          version: v0
        refresh: onTimeRangeChanged
        regex: ''
        skipUrlSync: false
        sort: alphabeticalAsc
    - kind: QueryVariable
      spec:
        allowCustomValue: false
        current:
          text: ''
          value: ''
        definition: >-
          label_values(temporal_activity_execution_latency_sum{workflow_type=~"$workflow"},activity_type)
        hide: dontHide
        includeAll: true
        multi: true
        name: activity
        options: []
        query:
          group: prometheus
          kind: DataQuery
          spec:
            qryType: 1
            query: >-
              label_values(temporal_activity_execution_latency_sum{workflow_type=~"$workflow"},activity_type)
            refId: PrometheusVariableQueryEditor-VariableQuery
          version: v0
        refresh: onTimeRangeChanged
        regex: ''
        skipUrlSync: false
        sort: alphabeticalAsc
status: {}
